name: Release Signed APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
        type: string

permissions:
  contents: write

jobs:
  release-apk:
    name: Build & Publish Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Resolve release version metadata
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version_name }}"
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          CLEAN_VERSION="${RAW#v}"
          TAG_NAME="v${CLEAN_VERSION}"
          VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_name=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: ./gradlew :core:model:test :core:security:testDebugUnitTest :core:backup:testDebugUnitTest :app:testDebugUnitTest --no-daemon

      - name: Decode release signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Missing one or more required signing secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/kanso-release.jks"

      - name: Build signed Release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/kanso-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KANSO_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          KANSO_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify APK signature and package release files
        shell: bash
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Signed release APK not found at $APK_PATH"
            exit 1
          fi
          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::Could not locate apksigner in Android SDK build-tools"
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$APK_PATH"
          mkdir -p dist
          OUT_APK="dist/Kanso-${{ steps.version.outputs.tag_name }}-release.apk"
          cp "$APK_PATH" "$OUT_APK"
          sha256sum "$OUT_APK" > "${OUT_APK}.sha256"

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Kanso-${{ steps.version.outputs.tag_name }}-release-apk
          path: dist/*
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: Kanso ${{ steps.version.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/Kanso-${{ steps.version.outputs.tag_name }}-release.apk*
